[build]
builder = "nixpacks"

[deploy]
startCommand = "npm start"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"

# Frontend service configuration
# This service will use Railway's PORT environment variable

[variables]
NEXT_PUBLIC_API_URL = "https://watermajibackend-production.up.railway.app"
API_BASE_URL = "https://watermajibackend-production.up.railway.app/api"
FRONTEND_URL = "https://watermajifrontend-production.up.railway.app"
